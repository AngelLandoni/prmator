[workspace]
resolver = "2"
members = ["crates/protocol", "crates/bridge", "crates/app", "crates/syntax"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
protocol = { path = "crates/protocol" }
